<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="./output.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-100">

    <!-- Main Container -->
    <div class="w-full max-w-4xl h-auto lg:h-[90vh] max-h-[600px] bg-white rounded-2xl shadow-xl overflow-hidden grid grid-cols-1 lg:grid-cols-2"
        style="margin-bottom: 20px;">

        <!-- Left Login Section -->
        <div class="p-8 lg:p-10 flex flex-col justify-center relative">

            <!-- LOGO -->
            <a href="index.html">
                <div class="absolute top-6 left-6 lg:top-10 lg:left-10 text-2xl font-bold text-red-500">
                    LOGO
                </div>
            </a>

            <!-- Google Login Button -->
            <button
                class="w-[180px] mx-auto py-3 rounded-full border border-gray-300 flex items-center justify-center gap-3 hover:bg-gray-50 transition cursor-pointer"
                style="margin-bottom: 20px;">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.26.81-.58z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                <span class="font-medium text-gray-700">Google</span>
            </button>

            <!-- Title -->
            <h2 class="text-3xl font-bold text-black" style="margin-bottom: 30px;">
                Log In
            </h2>

            <!-- Username -->
            <div class="mb-4">
                <input type="text" placeholder="Username"
                    class="w-full px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Password -->
            <div class="mb-5">
                <input type="password" placeholder="Password"
                    class="w-full px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Remember -->
            <div class="flex items-center justify-between text-sm text-gray-600 mb-6">
                <label class="flex items-center gap-2">
                    <input type="checkbox" class="accent-black">
                    Remember Me
                </label>
                <a href="#" class="hover:underline">
                    Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button class="w-full py-3 rounded-full bg-black text-white font-medium hover:bg-gray-800 transition">
                Log In
            </button>

            <!-- Sign Up -->
            <p class="text-sm text-gray-600 mt-8 mb-4 text-center">
                or
                <a href="signup.html" class="font-medium hover:underline">
                    Sign Up
                </a>
            </p>
        </div>

        <!-- Img -->
        <div class="block relative w-full h-50 lg:h-auto">
            <img src="./assets/login.jpeg" alt="Login Image" class="w-full h-full object-cover" />
        </div>
    </div>
</body>

</html>
