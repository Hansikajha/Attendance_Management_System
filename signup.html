<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="./output.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-100">

    <!-- Main Container -->
    <div
        class="w-full max-w-4xl h-auto lg:h-[90vh] max-h-[600px] bg-white rounded-2xl shadow-xl overflow-hidden grid grid-cols-1 lg:grid-cols-2">

        <!-- Left Login Section -->
        <div class="p-8 lg:p-10 flex flex-col justify-center relative">

            <!-- LOGO -->
            <a href="index.html">
                <div class="absolute top-6 left-6 lg:top-10 lg:left-10 text-2xl font-bold text-red-500">
                    LOGO
                </div>
            </a>

            <!-- Title -->
            <h2 class="text-3xl font-bold text-black text-center" style="margin-bottom: 20px;">
                Sign Up
            </h2>

            <!-- Username -->
            <div class="mb-4">
                <span>Full Name</span>
                <input type="text" placeholder="Full Name"
                    class="w-full px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Email Address -->
            <div class="mb-4">
                <span>Email Address</span>
                <input type="email" placeholder="Email"
                    class="w-full px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Password -->
            <div class="mb-5">
                <span>Password</span>
                <input type="password" placeholder="Password"
                    class="w-full px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Confirm Password -->
            <div class="mb-5">
                <span>Confirm Password</span>
                <input type="password" placeholder="Confirm Password"
                    class="w-full px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Create Account Button -->
            <a href="login.html">
                <button class="w-full py-3 rounded-full bg-black text-white font-medium hover:bg-gray-800 transition">
                    Create Account
                </button>
            </a>

            <!-- Sign Up -->
            <p class="text-sm text-gray-600 mt-8 text-center">
                or
                <a href="login.html" class="font-medium hover:underline">
                    Login
                </a>
            </p>
        </div>

        <!-- Img -->
        <div class="block relative w-full h-50 lg:h-auto">
            <img src="./assets/login.jpeg" alt="Login Image" class="w-full h-full object-cover" />
        </div>
    </div>
</body>

</html>
